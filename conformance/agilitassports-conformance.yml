- id: ucp
  name: Universal Commerce Protocol
  version: '2026-08-25'
  conforms: true
  domain_standard: true
  market: agentic commerce / retail checkout
  evidence: >-
    https://agilitas.com/.well-known/ucp returns a UCP merchant profile declaring
    ucp.version "2026-08-25", the dev.ucp.shopping service with transport "mcp", and the capability
    set dev.ucp.shopping.checkout, .cart, .order, .fulfillment, .discount, .catalog.search and
    .catalog.lookup plus the dev.shopify.catalog extension. The declared tools answer live.
  evidence_url: https://agilitas.com/.well-known/ucp
  spec: https://ucp.dev/2026-08-25/specification/overview/
  note: >-
    This is the domain-standard signature for this market: an agent that already speaks UCP can
    transact with this merchant with no bespoke connector. Implemented by the Shopify platform on the
    merchant's behalf, not authored by Agilitas.

- id: mcp
