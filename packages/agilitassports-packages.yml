finding: >-
  Agilitas ships no client library in any registry. There is no first-party SDK, no CLI, no stdio MCP
  package and no published code of any kind. The entire programmable surface is the two remote MCP
  endpoints plus the documented read-only storefront JSON routes — all callable over plain HTTP with
  no dependency to install. No SDKs pointer is claimed in apis.yml, because claiming one would assert
  a client library that does not exist.

