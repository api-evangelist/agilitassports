note: >-
  Agilitas publishes no API plans, tiers, quotas or developer pricing of any kind, because it runs no
  developer program. The agent surface it does expose — the UCP/MCP commerce endpoints and the
  documented storefront JSON routes — is free and anonymous to call, with no signup, no key and no
  metering disclosed. What is priced here is merchandise: footwear and apparel sold to consumers,
  individually priced per product variant in the storefront catalog. There is no "contact sales"
  API gate either; there is simply nothing to buy as a developer.

