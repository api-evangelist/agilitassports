apis:
- aid: agilitassports:agilitassports-commerce-mcp-api
  name: Agilitas Commerce MCP API
  description: >-
    The agent-facing commerce surface for the Agilitas store, implementing the Universal Commerce
    Protocol (dev.ucp.shopping) over the Model Context Protocol. Thirteen tools cover catalog search
    and lookup, product detail, cart create/update/cancel, checkout create/update/complete/cancel and
    order retrieval. Anonymous — no API key or OAuth token is needed to initialize, list tools or
    search the catalog — but every tool requires a meta.ucp-agent.profile URI, complete_checkout
    additionally requires meta.idempotency-key, and the provider's own agent instructions require
    contemporaneous buyer approval before any payment is completed.
  humanURL: https://agilitas.com/agents.md
  baseURL: https://agilitas.com/api/ucp/mcp
  tags:
  - Commerce
  - Catalog
  - Cart
  - Checkout
  - Order
  - Agentic Commerce
  tags_raw:
  - Commerce
  - Catalog
  - Cart
  - Checkout
  - Orders
  - Agentic Commerce
