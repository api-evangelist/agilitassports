- aid: agilitassports:agilitassports-storefront-json-api
  name: Agilitas Storefront JSON API
  description: >-
    The read-only storefront JSON endpoints Agilitas names for agents in its own /llms.txt and
    /agents.md — product JSON at /products/{handle}.json, collection product listings at
    /collections/{handle}/products.json, the all-products feed at /products.json, and the sitemap set
    including a dedicated agentic-discovery sitemap. No authentication is required. These are Shopify
    Online Store routes served on the Agilitas domain and named by Agilitas in its own published
    agent instructions.
  humanURL: https://agilitas.com/llms.txt
  baseURL: https://agilitas.com
  x-base-note: >-
    The site root IS the API base for this entry, not a marketing URL standing in for one. Shopify
    Online Store JSON routes are served off the storefront origin — https://agilitas.com/products.json
    returned HTTP 200 application/json on 2026-09-12 — and Agilitas names exactly these paths in its
    own /llms.txt.
  tags:
