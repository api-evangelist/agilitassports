aid: agilitassports
name: Agilitas Sports
description: >-
  Agilitas Sports Private Limited is a Bengaluru-based sports and athleisure company founded in
  February 2023 by former Puma India leaders Abhishek Ganguly, Atul Bajaj and Amit Prabhu, built as a
  vertically integrated manufacture-brand-retail ecosystem rather than a software business. It
  acquired Mochiko Shoes, one of India's largest sports footwear manufacturers, holds the exclusive
  India licence for Lotto, and runs the one8 brand with Virat Kohli. It publishes no developer
  program and no OpenAPI, but its Shopify storefront at agilitas.com serves a real agent-facing
  commerce surface: /llms.txt and /agents.md, a /.well-known/ucp Universal Commerce Protocol merchant
  profile (UCP 2026-08-25), and two live unauthenticated Model Context Protocol endpoints — a
  thirteen-tool catalog/cart/checkout/order server and a one-tool policy-and-FAQ server.
